<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connect WhatsApp - CabMind</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Connect your WhatsApp Business to CabMind AI-powered taxi booking system" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a365d 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
      max-width: 560px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: #ffffff;
      padding: 30px 30px 20px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .brand {
      font-size: 32px;
      font-weight: 800;
      color: #1a5276;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 14px;
      color: #1a5276;
      font-weight: 500;
    }

    .content {
      padding: 30px;
    }

    h2 {
      color: #1a365d;
      font-size: 24px;
      margin-bottom: 12px;
      text-align: center;
    }

    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 18px;
    }

    .field {
      margin: 14px 0 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #1a5276;
      box-shadow: 0 0 0 3px rgba(26,82,118,0.15);
    }

    .connect-btn {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      border: none;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.25);
    }

    .connect-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(37, 211, 102, 0.35);
    }

    .connect-btn:disabled {
      background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      font-size: 13px;
      line-height: 1.6;
    }
    .status.show { display: block; }
    .status.info { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
    .status.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status.warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

    .debug {
      margin-top: 14px;
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      display: none;
    }
    .debug.show { display: block; }

    .debug h4 {
      color: #25D366;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .debug pre {
      color: #cbd5e1;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="brand">🚕 CABMIND</div>
      <div class="tagline">AI-Powered Communication for Taxi Operators</div>
    </div>

    <div class="content">
      <h2>Connect Your WhatsApp</h2>
      <p class="description">
        Test page for Embedded Signup + n8n webhook.
        Enter client ID and complete Meta signup flow.
      </p>

      <div class="field">
        <label for="clientId">Client ID (required)</label>
        <input id="clientId" type="text" placeholder="e.g. aa_hendon" />
      </div>

      <div id="fb-root"></div>

      <button class="connect-btn" id="connectBtn" onclick="launchWhatsAppSignup()">
        Connect WhatsApp Business
      </button>

      <div id="statusMessage" class="status"></div>

      <div id="debugPanel" class="debug">
        <h4>🔧 Debug Output</h4>
        <pre id="debugOutput">Waiting...</pre>
      </div>

      <div class="footer-note">
        🔒 Secure connection via Meta Embedded Signup<br />
        Webhook: /client-signup (n8n)
      </div>
    </div>
  </div>

  <script>
    // ✅ Keep values EXACTLY like Meta builder (working)
    const CONFIG = {
      appId: "1302145801707701",
      configId: "1819814595431396",
      apiVersion: "v24.0",

      n8nWebhook: "https://automation.cabmind.co.uk/webhook/client-signup",

      debug: true
    };

    // Store latest data we capture
    const STATE = {
      code: null,
      waba_id: null,
      phone_number_id: null,
      last_post_message: null,
      last_sdk_response: null
    };

    function showStatus(message, type = "info") {
      const el = document.getElementById("statusMessage");
      el.className = "status show " + type;
      el.textContent = message;
    }

    function log(message, obj) {
      console.log("[CabMind]", message, obj || "");
      if (!CONFIG.debug) return;

      const panel = document.getElementById("debugPanel");
      const output = document.getElementById("debugOutput");
      panel.classList.add("show");

      if (obj !== undefined) {
        output.textContent = message + "\n\n" + JSON.stringify(obj, null, 2);
      } else {
        output.textContent = message;
      }
    }

    function setButtonLoading(loading) {
      const btn = document.getElementById("connectBtn");
      btn.disabled = loading;
      btn.textContent = loading ? "Connecting..." : "Connect WhatsApp Business";
    }

    function getClientId() {
      return (document.getElementById("clientId").value || "").trim();
    }

    async function sendToN8n() {
      const client_id = getClientId();
      if (!client_id) {
        showStatus("❌ Please enter Client ID first.", "error");
        setButtonLoading(false);
        return;
      }

      if (!STATE.code) {
        // code is required for token exchange (n8n side)
        log("⏳ Waiting for auth code...");
        return;
      }

      const payload = {
        client_id,
        code: STATE.code,
        waba_id: STATE.waba_id,
        phone_number_id: STATE.phone_number_id,
        timestamp: new Date().toISOString(),
        config_id: CONFIG.configId,
        api_version: CONFIG.apiVersion,
        raw_post_message: STATE.last_post_message,
        raw_sdk_response: STATE.last_sdk_response
      };

      showStatus("🚀 Sending signup info to n8n...", "info");
      log("🚀 Sending payload to n8n:", payload);

      try {
        const res = await fetch(CONFIG.n8nWebhook, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        let json;
        try { json = JSON.parse(text); } catch { json = { raw: text }; }

        if (!res.ok) {
          showStatus("❌ n8n returned error HTTP " + res.status, "error");
          log("❌ n8n error response:", json);
          setButtonLoading(false);
          return;
        }

        showStatus("✅ Sent to n8n successfully! Check Executions in n8n.", "success");
        log("✅ n8n success response:", json);
        window.location.href = "./signup-feature.html?client_id="+client_id;
        setButtonLoading(false);

      } catch (err) {
        showStatus("❌ Failed to call n8n webhook (network/CORS/SSL).", "error");
        log("❌ Network error:", { message: err.message });
        setButtonLoading(false);
      }
    }

    // ✅ EXACT SAME postMessage listener as Meta sample (with our storage)
    window.addEventListener("message", (event) => {
      if (event.origin !== "https://www.facebook.com" && event.origin !== "https://web.facebook.com") {
        return;
      }

      try {
        const data = JSON.parse(event.data);
        STATE.last_post_message = data;

        log("📩 postMessage from Meta:", data);

        if (data.type === "WA_EMBEDDED_SIGNUP") {
          if (data.event === "FINISH") {
            const { phone_number_id, waba_id } = data.data || {};
            STATE.phone_number_id = phone_number_id || null;
            STATE.waba_id = waba_id || null;

            showStatus("✅ Embedded Signup FINISH received. Sending to n8n...", "success");
            sendToN8n();

          } else if (data.event === "CANCEL") {
            showStatus("⚠️ Signup cancelled by user.", "warning");
            setButtonLoading(false);

          } else if (data.event === "ERROR") {
            showStatus("❌ Embedded Signup Error: " + (data.data?.error_message || "Unknown"), "error");
            setButtonLoading(false);
          }
        }
      } catch {
        // ignore non-JSON
      }
    });

    // ✅ EXACT SAME callback pattern as Meta sample
    const fbLoginCallback = (response) => {
      STATE.last_sdk_response = response;
      log("🔐 FB.login response:", response);

      if (response.authResponse) {
        STATE.code = response.authResponse.code || null;

        showStatus("✅ Facebook connected. Finish WhatsApp steps in popup...", "info");

        // We may not yet have FINISH event, but we can still send once code exists
        // (Sometimes FINISH comes slightly later)
        sendToN8n();
      } else {
        showStatus("❌ User cancelled login or login failed.", "error");
        setButtonLoading(false);
      }
    };

    // ✅ Launch Embedded Signup (keep extras EXACTLY same as your working sample)
    const launchWhatsAppSignup = () => {
      const client_id = getClientId();
      if (!client_id) {
        showStatus("❌ Client ID required before connecting.", "error");
        return;
      }

      if (!window.FB) {
        showStatus("❌ Facebook SDK not loaded yet. Wait 2 seconds and retry.", "error");
        return;
      }

      setButtonLoading(true);
      showStatus("Opening Meta Embedded Signup popup...", "info");

      // Reset state each run
      STATE.code = null;
      STATE.waba_id = null;
      STATE.phone_number_id = null;
      STATE.last_post_message = null;
      STATE.last_sdk_response = null;

      FB.login(fbLoginCallback, {
        config_id: CONFIG.configId,
        response_type: "code",
        override_default_response_type: true,
        extras: {
          version: "v3",
          featureType: "whatsapp_business_app_onboarding",
          sessionInfoVersion:"3"
        }
      });
    };

    // ✅ SDK init (same as builder)
    window.fbAsyncInit = function () {
      FB.init({
        appId: CONFIG.appId,
        autoLogAppEvents: true,
        xfbml: true,
        version: CONFIG.apiVersion
      });

      log("✅ Facebook SDK initialized (" + CONFIG.apiVersion + ")");
    };
  </script>

  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js">
  </script>
</body>
</html>
