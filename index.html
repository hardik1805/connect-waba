<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connect WhatsApp - CabMind</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Connect your WhatsApp Business to CabMind" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a365d 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
      max-width: 560px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      padding: 30px 30px 18px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }
    .brand {
      font-size: 32px;
      font-weight: 800;
      color: #1a5276;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 14px;
      color: #1a5276;
      font-weight: 500;
    }
    .content {
      padding: 28px 28px 24px;
    }
    h2 {
      color: #1a365d;
      font-size: 24px;
      margin-bottom: 10px;
      text-align: center;
    }
    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 18px;
    }

    .field {
      margin: 14px 0 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }
    input[type="text"]{
      width: 100%;
      padding: 14px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus{
      border-color: #1a5276;
      box-shadow: 0 0 0 3px rgba(26,82,118,0.15);
    }

    .connect-btn {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      border: none;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.25);
    }
    .connect-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(37, 211, 102, 0.35);
    }
    .connect-btn:disabled {
      background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      margin-top: 14px;
      padding: 14px 14px;
      border-radius: 12px;
      display: none;
      font-size: 13px;
      line-height: 1.6;
    }
    .status.show { display: block; }
    .status.info { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
    .status.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status.warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

    .debug {
      margin-top: 14px;
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      display: none;
    }
    .debug.show { display: block; }
    .debug h4 {
      color: #25D366;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .debug pre {
      color: #cbd5e1;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="brand">🚕 CABMIND</div>
      <div class="tagline">AI-Powered Communication for Taxi Operators</div>
    </div>

    <div class="content">
      <h2>Connect WhatsApp (Test)</h2>
      <p class="description">
        This page is ONLY for testing whether Meta Embedded Signup can trigger
        data and whether n8n receives the webhook.
      </p>

      <div class="field">
        <label for="clientId">Client ID (required)</label>
        <input id="clientId" type="text" placeholder="e.g. aa_hendon" />
      </div>

      <button class="connect-btn" id="connectBtn" onclick="launchWhatsAppSignup()">
        Connect WhatsApp Business
      </button>

      <div id="statusMessage" class="status"></div>

      <div id="debugPanel" class="debug">
        <h4>🔧 Debug Output</h4>
        <pre id="debugOutput">Waiting...</pre>
      </div>

      <div class="footer-note">
        🔒 Secure connection via Meta Embedded Signup<br/>
        Test webhook → client-signup
      </div>
    </div>
  </div>

  <!-- =========================================================
       CONFIG
  ========================================================== -->
  <script>
    const CONFIG = {
      appId: "1302145801707701",
      configId: "1819814595431396",

      // Use what Meta builder shows
      apiVersion: "v24.0",

      // If you have a Solution ID, set it here (for testing, same as appId is OK)
      solutionId: "1302145801707701",

      // Your n8n webhook (POST)
      n8nClientSignupWebhook: "https://automation.cabmind.co.uk/webhook/client-signup",

      // For debugging only
      debug: true,
    };

    // We store partial data until we have everything we want to send to n8n
    const SIGNUP_STATE = {
      code: null,
      waba_id: null,
      phone_number_id: null,
      business_id: null,
      last_session_event: null,
    };
  </script>

  <!-- =========================================================
       UI HELPERS
  ========================================================== -->
  <script>
    function showStatus(message, type = "info") {
      const el = document.getElementById("statusMessage");
      el.className = "status show " + type;
      el.textContent = message;
    }

    function log(message, obj) {
      console.log("[CabMind]", message, obj || "");
      if (!CONFIG.debug) return;

      const panel = document.getElementById("debugPanel");
      const output = document.getElementById("debugOutput");
      panel.classList.add("show");

      if (obj !== undefined) {
        output.textContent = message + "\n\n" + JSON.stringify(obj, null, 2);
      } else {
        output.textContent = message;
      }
    }

    function setButtonLoading(isLoading) {
      const btn = document.getElementById("connectBtn");
      if (isLoading) {
        btn.disabled = true;
        btn.textContent = "Connecting...";
      } else {
        btn.disabled = false;
        btn.textContent = "Connect WhatsApp Business";
      }
    }

    function getClientId() {
      return (document.getElementById("clientId").value || "").trim();
    }
  </script>

  <!-- =========================================================
       LISTEN FOR SESSION INFO EVENTS (Meta postMessage)
  ========================================================== -->
  <script>
    window.addEventListener("message", (event) => {
      // IMPORTANT: only accept Meta origins
      if (event.origin !== "https://www.facebook.com" && event.origin !== "https://web.facebook.com") {
        return;
      }

      try {
        const data = JSON.parse(event.data);

        // Always show what we receive
        log("📨 postMessage received from Meta:", data);

        if (data.type === "WA_EMBEDDED_SIGNUP") {
          SIGNUP_STATE.last_session_event = data;

          // Normal Embedded Signup event names: FINISH / CANCEL / ERROR
          if (data.event === "FINISH" || data.event === "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING") {
            const payload = data.data || {};
            SIGNUP_STATE.waba_id = payload.waba_id || SIGNUP_STATE.waba_id;
            SIGNUP_STATE.phone_number_id = payload.phone_number_id || SIGNUP_STATE.phone_number_id;

            showStatus("✅ Embedded Signup finished. Preparing to send to n8n...", "success");
            trySendToN8n();
          }

          if (data.event === "CANCEL") {
            showStatus("⚠️ Signup cancelled by user.", "warning");
            setButtonLoading(false);
          }

          if (data.event === "ERROR") {
            const payload = data.data || {};
            showStatus("❌ Embedded Signup error: " + (payload.error_message || "Unknown error"), "error");
            setButtonLoading(false);
          }
        }
      } catch (e) {
        // Non-JSON messages are common, ignore
      }
    });
  </script>

  <!-- =========================================================
       FB LOGIN CALLBACK (AUTH CODE)
  ========================================================== -->
  <script>
    function fbLoginCallback(response) {
      log("🔐 FB.login callback response:", response);

      if (response && response.authResponse) {
        // ✅ This is the authorization code you must exchange server-side
        SIGNUP_STATE.code = response.authResponse.code || null;

        showStatus("✅ Facebook connected. Complete the WhatsApp steps in the popup...", "info");

        // We might already have enough to send to n8n (sometimes session event comes later)
        trySendToN8n();
      } else {
        showStatus("❌ Login cancelled or failed.", "error");
        setButtonLoading(false);
      }
    }
  </script>

  <!-- =========================================================
       SEND TO n8n (TEST)
  ========================================================== -->
  <script>
    async function trySendToN8n() {
      const client_id = getClientId();

      if (!client_id) {
        showStatus("❌ Please enter Client ID first.", "error");
        setButtonLoading(false);
        return;
      }

      // Minimum required: client_id + code
      // waba_id & phone_number_id often come from postMessage FINISH event
      if (!SIGNUP_STATE.code) {
        log("⏳ Waiting for code...");
        return;
      }

      // Optional: wait for phone_number_id too
      // If you want strict requirement, uncomment below:
      // if (!SIGNUP_STATE.phone_number_id) {
      //   log("⏳ Waiting for phone_number_id from postMessage FINISH...");
      //   return;
      // }

      const payload = {
        client_id,
        flow_type: "coexistence",
        code: SIGNUP_STATE.code,
        waba_id: SIGNUP_STATE.waba_id,
        phone_number_id: SIGNUP_STATE.phone_number_id,
        business_id: SIGNUP_STATE.business_id,
        sdk_version: CONFIG.apiVersion,
        config_id: CONFIG.configId,
        timestamp: new Date().toISOString(),
        raw_session_event: SIGNUP_STATE.last_session_event || null,
      };

      log("🚀 Sending payload to n8n /client-signup ...", payload);
      showStatus("🚀 Sending signup data to n8n...", "info");

      try {
        const res = await fetch(CONFIG.n8nClientSignupWebhook, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const text = await res.text();
        let json;
        try { json = JSON.parse(text); } catch { json = { raw: text }; }

        if (!res.ok) {
          showStatus("❌ n8n error: HTTP " + res.status, "error");
          log("❌ n8n responded with error:", json);
          setButtonLoading(false);
          return;
        }

        showStatus("✅ Sent to n8n successfully! Check executions tab in n8n.", "success");
        log("✅ n8n response:", json);
        setButtonLoading(false);

      } catch (err) {
        showStatus("❌ Failed to reach n8n webhook. Check URL / CORS / HTTPS.", "error");
        log("❌ Network error:", { message: err.message });
        setButtonLoading(false);
      }
    }
  </script>

  <!-- =========================================================
       LAUNCH EMBEDDED SIGNUP (Coexistence)
  ========================================================== -->
  <script>
    function launchWhatsAppSignup() {
      const client_id = getClientId();
      if (!client_id) {
        showStatus("❌ Client ID is required before connecting.", "error");
        return;
      }

      if (!window.FB) {
        showStatus("❌ Facebook SDK not loaded yet. Please wait 2 seconds and retry.", "error");
        return;
      }

      setButtonLoading(true);
      showStatus("Opening WhatsApp Embedded Signup popup...", "info");

      // Reset state for fresh test run
      SIGNUP_STATE.code = null;
      SIGNUP_STATE.waba_id = null;
      SIGNUP_STATE.phone_number_id = null;
      SIGNUP_STATE.business_id = null;
      SIGNUP_STATE.last_session_event = null;

      // ✅ Meta Embedded Signup (Coexistence)
      FB.login(fbLoginCallback, {
        config_id: CONFIG.configId,
        response_type: "code",
        override_default_response_type: true,

        // Must match Meta builder expectations
        extras: {
          version: "v3",
          featureType: "whatsapp_business_app_onboarding",
          sessionInfoVersion: 3,
          setup: {
            solutionID: CONFIG.solutionId
          }
        }
      });
    }
  </script>

  <!-- =========================================================
       FACEBOOK SDK INIT (Meta Builder style)
  ========================================================== -->
  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId: CONFIG.appId,
        autoLogAppEvents: true,
        xfbml: true,
        version: CONFIG.apiVersion
      });

      log("✅ Facebook SDK initialized (" + CONFIG.apiVersion + ")");
    };
  </script>

  <script async defer crossorigin="anonymous"
          src="https://connect.facebook.net/en_US/sdk.js"></script>

</body>
</html>
