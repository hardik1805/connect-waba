<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cabmind - Connect WhatsApp</title>

  <style>
    body { font-family: Arial, sans-serif; background:#f6f7fb; margin:0; padding:0; }
    .wrap { max-width: 720px; margin: 40px auto; background:#fff; padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { color:#444; }
    label { font-weight: bold; display:block; margin-top: 16px; }
    input { width:100%; padding: 12px; margin-top: 6px; border:1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { margin-top: 16px; padding: 12px 16px; border:0; border-radius: 10px; background:#1877f2; color:#fff; font-weight:bold; cursor:pointer; font-size: 15px; }
    button:disabled { background:#9bbcf9; cursor:not-allowed; }
    pre { background:#0b1020; color:#e9eefc; padding: 12px; border-radius: 10px; overflow:auto; font-size: 12px; }
    .row { display:flex; gap:10px; margin-top: 14px; }
    .pill { background:#f1f5ff; color:#1a3a8a; padding: 6px 10px; border-radius: 999px; font-size: 12px; display:inline-block; }
    .success { background:#e9fff0; color:#0b6b2d; }
    .error { background:#ffecec; color:#9b111e; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Connect WhatsApp Business</h1>
    <p class="pill">Coexistence Enabled • Meta Embedded Signup v3 • sessionInfoVersion=3</p>

    <label>Client ID (required)</label>
    <input id="client_id" placeholder="e.g. aa_hendon" />

    <button id="btn" onclick="startSignup()">Connect WhatsApp Business</button>

    <div class="row">
      <span id="status" class="pill">Idle</span>
    </div>

    <h3>Debug Log</h3>
    <pre id="log">{}</pre>
  </div>

  <script>
    const CONFIG = {
      app_id: "1302145801707701",
      config_id: "1819814595431396",
      api_version: "v24.0",
      featureType: "whatsapp_business_app_onboarding",
      sessionInfoVersion: "3",
      es_version: "v3",

      // ✅ n8n webhook (client signup)
      n8n_signup_url: "https://automation.cabmind.co.uk/webhook/client-signup"
    };

    let signupState = {
      client_id: null,
      code: null,
      waba_id: null,
      phone_number_id: null,
      business_id: null,
      raw_post_message: null,
      raw_fb_response: null,
      timestamp: null
    };

    function setStatus(text, type="") {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = "pill " + (type || "");
    }

    function log(obj) {
      document.getElementById("log").textContent = JSON.stringify(obj, null, 2);
    }

    // ✅ Receive postMessage from Meta (session info)
    window.addEventListener("message", (event) => {
      if (event.origin !== "https://www.facebook.com" && event.origin !== "https://web.facebook.com") return;

      try {
        const data = JSON.parse(event.data);

        if (data?.type === "WA_EMBEDDED_SIGNUP") {
          signupState.raw_post_message = data;

          if (data.event === "FINISH" || data.event === "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING") {
            signupState.waba_id = data.data?.waba_id;
            signupState.phone_number_id = data.data?.phone_number_id;
            signupState.business_id = data.data?.business_id;
            signupState.timestamp = new Date().toISOString();

            setStatus("Embedded signup finished ✅", "success");
            log(signupState);

            // ✅ Try submit if code is already captured
            trySubmitToN8n();
          }

          if (data.event === "CANCEL") {
            setStatus("User cancelled flow", "error");
            log({ cancel: data });
          }

          if (data.event === "ERROR") {
            setStatus("Embedded Signup error", "error");
            log({ error: data });
          }
        }
      } catch (e) {
        // ignore non-json
      }
    });

    function validateClientId(str) {
      return /^[a-z0-9_]+$/.test(str);
    }

    function startSignup() {
      const clientId = document.getElementById("client_id").value.trim();

      if (!clientId) {
        alert("Client ID is required");
        return;
      }
      if (!validateClientId(clientId)) {
        alert("Client ID must be lowercase and only use letters/numbers/_");
        return;
      }

      signupState.client_id = clientId;
      signupState.timestamp = new Date().toISOString();

      setStatus("Opening Meta popup...", "");
      log(signupState);

      document.getElementById("btn").disabled = true;

      // ✅ Launch embedded signup popup
      FB.login(fbLoginCallback, {
        config_id: CONFIG.config_id,
        response_type: "code",
        override_default_response_type: true,
        extras: {
          version: CONFIG.es_version,
          sessionInfoVersion: CONFIG.sessionInfoVersion,
          featureType: CONFIG.featureType
        }
      });
    }

    function fbLoginCallback(response) {
      signupState.raw_fb_response = response;

      // ✅ Capture authorization code
      if (response?.authResponse?.code) {
        signupState.code = response.authResponse.code;
        setStatus("Auth code received ✅", "success");
        log(signupState);

        // ✅ Try submit if FINISH already came
        trySubmitToN8n();
      } else {
        setStatus("No auth code received", "error");
        log(response);
        document.getElementById("btn").disabled = false;
      }
    }

    async function trySubmitToN8n() {
      // We need BOTH:
      // 1) code from FB.login callback
      // 2) waba_id + phone_number_id from postMessage

      if (!signupState.client_id) return;
      if (!signupState.code) return;
      if (!signupState.waba_id || !signupState.phone_number_id) return;

      setStatus("Sending details to Cabmind (n8n)...", "");

      try {
        const res = await fetch(CONFIG.n8n_signup_url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_id: signupState.client_id,
            code: signupState.code,
            waba_id: signupState.waba_id,
            phone_number_id: signupState.phone_number_id,
            business_id: signupState.business_id,
            config_id: CONFIG.config_id,
            api_version: CONFIG.api_version,
            timestamp: signupState.timestamp,
            raw_post_message: signupState.raw_post_message,
            raw_fb_response: signupState.raw_fb_response
          })
        });

        const data = await res.json();
        log({ signupState, n8n_response: data });

        if (data?.ok) {
          setStatus("✅ Connected successfully!", "success");

          // ✅ Redirect to config form page
          if (data.redirect_url) {
            window.location.href = data.redirect_url;
            return;
          }

          // fallback
          alert("Connected successfully but no redirect_url returned from n8n");
        } else {
          setStatus("❌ n8n rejected request", "error");
          alert(data?.message || "Client signup failed");
        }

      } catch (e) {
        setStatus("❌ Failed to contact n8n", "error");
        alert("Error sending data to n8n: " + e.message);
      } finally {
        document.getElementById("btn").disabled = false;
      }
    }
  </script>

  <!-- ✅ Meta JS SDK -->
  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId: "1302145801707701",
        autoLogAppEvents: true,
        xfbml: true,
        version: "v24.0"
      });
    };
  </script>
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js"></script>
</body>
</html>
